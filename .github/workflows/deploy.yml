name: Deploy Molemall to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: molemall-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check game source
        run: |
          test -f index.html || { echo "Missing root index.html."; exit 1; }

      - name: Validate arcade scripts and assets
        run: |
          node --check arcade/game.js
          test -f arcade/index.html
          test -f arcade/style.css
          grep -q 'href="/arcade/"' index.html
          grep -q '/arcade/game.js' arcade/index.html

      - name: Prepare deploy directory (exclude archives and Git metadata)
        run: |
          mkdir -p deploy-dist
          rsync -a --exclude '.git/' --exclude '.github/' --exclude 'deploy-dist/' --exclude '*.zip' ./ deploy-dist/
          test -f deploy-dist/index.html

      - name: Deploy existing Pages project
        run: npx --yes wrangler@4 pages deploy deploy-dist --project-name=molemall-beta --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed source files
        run: |
          test -s deploy-dist/minigame/index.html
          test -s deploy-dist/src/minigame.css
          test -s deploy-dist/src/minigame.js
          test -s deploy-dist/src/arena-presentation.css
          test -s deploy-dist/assets/scenes/serpent-theater.webp
          grep -q "PLUSH BATTLE" deploy-dist/minigame/index.html
          grep -q "PLUSH ARCADE" deploy-dist/arcade/index.html

      - name: Check production access (private beta aware)
        run: |
          # Private beta returns 401 to automated checks without a login.
          # An HTTP 401 is expected access control, not a deployment failure.
          code=$(curl --silent --show-error --location --max-time 20 --output /tmp/molemall-health.html --write-out '%{http_code}' \
            "https://molemall-beta.pages.dev/arcade/?commit=${GITHUB_SHA}")
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::notice::Production is authentication-protected (HTTP $code). Cloudflare upload succeeded; unauthenticated page content cannot be smoke-tested."
          elif [ "$code" = "200" ]; then
            grep -q "PLUSH ARCADE" /tmp/molemall-health.html
          else
            echo "::error::Unexpected production HTTP status: $code"
            exit 1
          fi

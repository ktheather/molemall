<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a101f">
<title>오늘은 두더지굴! | 포춘쿠키 운세뽑기</title>
<style>
  :root{--gold:#ffd68e;--ink:#2e1923;--cream:#fff3db;--rose:#a9455a}
  *{box-sizing:border-box}html{min-height:100%}
  body{margin:0;min-height:100vh;color:var(--cream);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;background:#1f0b19;position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,#160514ed,#310f23c6,#160514ed),linear-gradient(180deg,#17071388,#170713f2),url('/assets/scenes/casino-lounge.webp') center/cover;z-index:-1}
  button,a{font:inherit}a{color:inherit;text-decoration:none}
  [hidden]{display:none!important}
  .topbar{max-width:1140px;margin:auto;padding:29px 24px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .back{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:#310f25aa;border:1px solid #d4a568b7;border-radius:999px;color:#fff0d6;font-size:13px;font-weight:800;transition:transform .18s,background .18s}
  .back:hover,.back:focus-visible{transform:translateX(-3px);background:#63324c}
  .hall-logo{font-family:Georgia,serif;font-size:12px;font-weight:800;letter-spacing:.18em;color:#fbd58d}
  .wrap{max-width:980px;margin:0 auto;min-height:calc(100vh - 130px);padding:8px 20px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:flex-start}
  .eyebrow{margin:8px 0 7px;color:#facd84;font:800 12px Georgia,serif;letter-spacing:.23em}
  h1{margin:0;font-weight:900;font-size:clamp(34px,5.2vw,62px);letter-spacing:-.055em;line-height:1.22;text-shadow:0 3px 12px #11050b}
  h1 span{color:#ffd57f}
  .sub{max-width:650px;font-size:clamp(13px,1.6vw,16px);line-height:1.7;color:#ffe7cf;margin:12px auto 18px}
  .machine{position:relative;width:min(100%,700px);padding:23px 24px 30px;border-radius:29px;border:2px solid #e6bb78;outline:6px solid #321825;box-shadow:0 14px 55px #10030bbd,0 0 54px #efb96135,inset 0 0 0 5px #7b4335;background:radial-gradient(circle at 50% 3%,#703446 0,#432133 45%,#281423 96%);overflow:hidden}
  .machine::before,.machine::after{content:"✦";position:absolute;color:#f9ce84;font-size:27px;opacity:.5;top:26px}.machine::before{left:29px}.machine::after{right:29px}
  .machine-title{color:#ffedc9;font-weight:900;font-size:17px;letter-spacing:.07em;margin:0 0 6px}
  .counter{font-size:12px;color:#dfb89a;margin:0 0 3px}
  .cookie-zone{position:relative;height:clamp(205px,32vw,280px);display:grid;place-items:center;perspective:800px}
  .cookie-btn{position:relative;width:clamp(230px,49vw,370px);height:clamp(170px,26vw,260px);cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation;filter:drop-shadow(0 11px 18px #11070ba6);transition:filter .18s,transform .18s}
  .cookie-btn:hover:not(:disabled),.cookie-btn:focus-visible{filter:drop-shadow(0 11px 24px #edb65ca6);transform:scale(1.04);outline:2px dashed #ffd18c;outline-offset:9px;border-radius:25px}
  .cookie-btn:disabled{cursor:default}.cookie-btn svg{width:100%;height:100%;overflow:visible;display:block}
  .cookie-left,.cookie-right{transition:transform .76s cubic-bezier(.18,.9,.25,1.35);transform-box:fill-box;transform-origin:center}
  .opened .cookie-left{transform:translate(-43px,-18px) rotate(-28deg)}
  .opened .cookie-right{transform:translate(46px,-20px) rotate(31deg)}
  .fortune-slip{transition:transform .7s cubic-bezier(.2,.8,.2,1.2),opacity .4s;transform:translateY(38px) scale(.65);opacity:0;transform-origin:center}
  .opened .fortune-slip{transform:translateY(-14px) scale(1);opacity:1}
  .spark{position:absolute;pointer-events:none;opacity:0;top:45%;left:50%;width:7px;height:10px;border-radius:2px;background:var(--c,#ffd793);transform:rotate(var(--ang,0deg))}
  .opened .spark{animation:burst .8s ease-out var(--delay,0s) both}
  @keyframes burst{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(var(--tx,30px),var(--ty,-80px)) rotate(720deg) scale(1)}}
  .hint{font-size:14px;color:#f9d9b9;min-height:24px;margin:0 0 14px}
  .main-button,.again{cursor:pointer;background:linear-gradient(180deg,#fff0c6,#f4bd64);border:2px solid #fff1c5;color:#572d22;border-radius:999px;font-weight:900;box-shadow:0 7px 0 #9f5f3f,0 13px 25px #10040d8c;transition:transform .15s,box-shadow .15s}
  .main-button{padding:14px 32px;font-size:17px;min-width:245px}.again{padding:12px 25px;font-size:15px}
  .main-button:hover:not(:disabled),.again:hover{transform:translateY(-3px);box-shadow:0 10px 0 #9f5f3f,0 16px 26px #10040d90}
  .main-button:active:not(:disabled),.again:active{transform:translateY(5px);box-shadow:0 2px 0 #9f5f3f}
  .main-button:disabled{filter:grayscale(.7);opacity:.7;cursor:wait}
  .fortune-result{margin:17px auto 0;padding:24px 25px 26px;text-align:center;background:linear-gradient(135deg,#fff9ea,#ffe9c6);color:#412622;border-radius:20px;border:3px solid #f2c87e;box-shadow:0 13px 30px #1d071a99,inset 0 0 0 5px #fff8e6;max-width:650px;width:100%;animation:reveal .58s ease-out}
  @keyframes reveal{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  .fortune-result .seal{font-size:26px;color:#c28b33}.fortune-result .category{margin:6px 0;color:#95533b;font-weight:900;font-size:14px}.fortune-result .message{font-size:clamp(18px,2.5vw,25px);font-weight:800;line-height:1.6;letter-spacing:-.025em;word-break:keep-all;margin:8px auto 16px;max-width:550px}.fortune-result .code{font:800 12px Georgia,serif;color:#987457;letter-spacing:.1em}
  .result-actions{margin-top:18px;display:flex;justify-content:center;gap:14px;align-items:center;flex-wrap:wrap}
  .footnote{margin:18px 0 0;color:#d0a991;font-size:12px}
  @media(max-width:600px){.topbar{padding:16px 15px 0}.hall-logo{font-size:10px}.wrap{padding:12px 15px 32px;min-height:calc(100vh - 80px)}.sub{margin-bottom:17px}.machine{padding:20px 12px 25px;border-radius:23px}.machine-title{font-size:15px}.fortune-result{padding:18px 14px}.footnote{line-height:1.5}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <header class="topbar"><a class="back" href="/">← 카지노 로비로</a><span class="hall-logo">♛ MOLEMALL FORTUNE HOUSE</span></header>
  <main class="wrap">
    <p class="eyebrow">THE DAILY FORTUNE</p>
    <h1>🥠 <span>오늘은 두더지굴!</span></h1>
    <p class="sub">포춘쿠키 안에 숨은 오늘의 행운을 열어봐!<br>200가지 운세 중 딱 하나가 랜덤으로 나와.</p>
    <section class="machine" aria-label="포춘쿠키 운세 추첨기">
      <p class="machine-title">✦ 두더지몰 행운 추첨기 ✦</p>
      <p class="counter">200가지의 특별한 문구 · 결과는 무작위</p>
      <div class="cookie-zone">
        <button class="cookie-btn" id="cookie" type="button" aria-label="포춘쿠키 깨기" disabled>
          <svg viewBox="0 0 380 255" role="img" aria-label="황금 포춘쿠키" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="cookieFill" x1=".1" y1="0" x2=".88" y2="1"><stop offset="0" stop-color="#fff0b3"/><stop offset=".37" stop-color="#e6aa50"/><stop offset=".78" stop-color="#b96e31"/><stop offset="1" stop-color="#86502b"/></linearGradient>
              <linearGradient id="cookieShine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbd6"/><stop offset=".65" stop-color="#ffe6a0"/><stop offset="1" stop-color="#f4b965"/></linearGradient>
              <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#210509" flood-opacity=".45"/></filter>
            </defs>
            <g class="fortune-slip" filter="url(#shadow)"><rect x="147" y="25" width="90" height="143" rx="7" fill="#fff8e5" stroke="#e9ba6a" stroke-width="3"/><path d="M160 49h64M160 66h64M160 82h55M160 97h60M160 115h43" stroke="#ceaa80" stroke-width="3" stroke-linecap="round"/><text x="190" y="145" font-size="30" text-anchor="middle">✦</text></g>
            <g class="cookie-left" filter="url(#shadow)"><path d="M195 206C117 236 56 209 43 155 30 111 53 60 103 40c44-18 86 19 97 72 5 24 4 60-5 94z" fill="url(#cookieFill)" stroke="#ffdf96" stroke-width="7"/><path d="M189 193C123 212 73 187 64 151 53 111 75 73 107 59c34-13 72 23 82 67" fill="none" stroke="url(#cookieShine)" stroke-width="12" stroke-linecap="round" opacity=".92"/><path d="M190 199C140 183 111 158 103 137" stroke="#804025" stroke-width="6" stroke-linecap="round" fill="none" opacity=".85"/></g>
            <g class="cookie-right" filter="url(#shadow)"><path d="M190 206c79 29 135 0 150-51 13-44-10-95-59-115-45-18-86 19-97 72-5 24-4 60 6 94z" fill="url(#cookieFill)" stroke="#ffda8b" stroke-width="7"/><path d="M197 193c66 17 115-11 123-49 9-35-13-75-45-87-36-14-73 23-83 69" fill="none" stroke="url(#cookieShine)" stroke-width="11" stroke-linecap="round" opacity=".85"/><path d="M188 196c47-17 82-40 87-69" stroke="#804025" stroke-width="6" stroke-linecap="round" fill="none" opacity=".78"/></g>
          </svg>
          <span class="spark" style="--tx:-120px;--ty:-88px;--ang:50deg;--c:#ffe99e"></span><span class="spark" style="--tx:-80px;--ty:-125px;--delay:.04s;--c:#ff7196"></span><span class="spark" style="--tx:65px;--ty:-130px;--delay:.08s;--c:#a1d7fb"></span><span class="spark" style="--tx:130px;--ty:-80px;--delay:.1s;--c:#ffe99e"></span><span class="spark" style="--tx:-160px;--ty:15px;--delay:.07s;--c:#ffd087"></span><span class="spark" style="--tx:150px;--ty:30px;--delay:.1s;--c:#ff7196"></span><span class="spark" style="--tx:-40px;--ty:-160px;--delay:.04s;--c:#d4a4fc"></span><span class="spark" style="--tx:34px;--ty:145px;--delay:.08s;--c:#ffd087"></span>
        </button>
      </div>
      <p class="hint" id="hint" role="status">행운의 쿠키를 준비하는 중…</p>
      <button class="main-button" id="draw" type="button" disabled>🥠 운세를 뽑아봐!</button>
      <section class="fortune-result" id="result" aria-live="polite" aria-atomic="true" hidden>
        <div class="seal" aria-hidden="true">✦ ✧ ✦</div>
        <div class="category" id="category"></div>
        <p class="message" id="message"></p>
        <span class="code" id="code"></span>
        <div class="result-actions"><button class="again" id="again" type="button">✧ 한 번 더 뽑기</button></div>
      </section>
    </section>
    <p class="footnote">포춘쿠키는 즐거움을 위한 랜덤 메시지입니다. 결과는 매번 달라질 수 있어요.</p>
  </main>
  <script src="/fortune/fortune.js" defer></script>
</body>
</html>
